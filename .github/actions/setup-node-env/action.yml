name: Setup Node environment
description: Install the project Node.js runtime and npm dependencies.

inputs:
  node-version:
    description: Node.js version used by the project.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
