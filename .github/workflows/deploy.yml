name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: browser-audit-changes
        name: Detect browser audit changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "changed=manual workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base commit unavailable: ${base:-empty}; fallback to HEAD^"
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "changed=base commit unavailable; run browser audits defensively" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "detecting browser audit changes from $base to $GITHUB_SHA"

          changed="$(
            git diff --name-only "$base" "$GITHUB_SHA" -- \
              .github/workflows/deploy.yml \
              package.json \
              package-lock.json \
              vite.config.ts \
              tsconfig*.json \
              scripts/search/common.mjs \
              scripts/validate/lighthouse-baseline.mjs \
              scripts/validate/lighthouse-sankey-trace.mjs \
              src/router \
              src/views/RelationView.vue \
              src/views/RelationRouteShell.vue \
              src/views/relation \
              src/components/relation \
              src/components/EntityLinkSection.vue \
              src/composables/useBreakpoints.ts \
              src/composables/useRelationGraph.ts
          )"

          if [[ -n "$changed" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
          fi
      - run: npx playwright install --with-deps chromium
        if: steps.browser-audit-changes.outputs.run == 'true'
      - run: npm run lint
      - run: npm run type-check
      - run: npm run validate:data
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run validate:schema-docs
      - run: npm run validate:home-counts
      - run: npm run export:data
      - run: npm run build-only
      - run: npm run export:data-package
      - run: npm run audit:bundle:check
      - run: npm run validate:data-export
      - run: npm run validate:data-package
      - run: npm run test:lighthouse
        if: steps.browser-audit-changes.outputs.run == 'true'
        continue-on-error: true
      - run: npm run audit:lighthouse-sankey
        if: steps.browser-audit-changes.outputs.run == 'true'
        continue-on-error: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
