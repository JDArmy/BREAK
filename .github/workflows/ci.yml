name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
      - run: npm run lint
      - run: npm run type-check
      - run: npm run validate:data
      - run: npm run validate:schema-docs
      - run: npm run validate:home-counts

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
      - run: npm run test
      - run: npm run test:coverage

  data-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run export:data-package
      - run: npm run validate:data-export
      - run: npm run validate:data-package
      - uses: actions/upload-artifact@v4
        with:
          name: ci-static-data
          path: public/data
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: data-export
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
      - uses: actions/download-artifact@v4
        with:
          name: ci-static-data
          path: public/data
      - run: npm run build-only
      - run: npm run audit:bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: ci-site-build
          path: |
            dist
            public/data
          if-no-files-found: error
          retention-days: 1

  browser-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser-smoke
            command: npm run test:smoke
            timeout-minutes: 25
          - name: relation-stability
            command: npm run test:relation-stability
            timeout-minutes: 25
            break-force-relation-stability: "1"
          - name: lighthouse-baseline
            command: npm run test:lighthouse
            timeout-minutes: 30
            break-force-browser-regression: "1"
          - name: site-performance
            command: npm run test:performance
            timeout-minutes: 25
          - name: visual-review
            command: npm run test:visual-review
            timeout-minutes: 30
            artifact-name: browser-visual-review
            artifact-path: research/search-reports/browser-visual-review
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
      - uses: ./.github/actions/setup-playwright
      - run: ${{ matrix.command }}
        env:
          BREAK_FORCE_RELATION_STABILITY: ${{ matrix.break-force-relation-stability }}
          BREAK_FORCE_BROWSER_REGRESSION: ${{ matrix.break-force-browser-regression }}
      - uses: actions/upload-artifact@v4
        if: always() && matrix.artifact-name != ''
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
