name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run validate:data
      - run: npm run validate:schema-docs
      - run: npm run validate:home-counts

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run test:coverage

  data-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run export:data-package
      - run: npm run validate:data-export
      - run: npm run validate:data-package

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run build-only
      - run: npm run audit:bundle:check

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run build-only
      - run: npm run test:smoke

  relation-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run build-only
      - run: npm run test:relation-stability
        env:
          BREAK_FORCE_RELATION_STABILITY: "1"

  browser-regression-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: gate
        env:
          BREAK_PREVIOUS_VERSION_REF: ${{ github.base_ref }}
        run: npm run ci:browser-regression-gate

  browser-regression:
    runs-on: ubuntu-latest
    needs: browser-regression-gate
    if: needs.browser-regression-gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run export:data
      - run: npm run export:data-en
      - run: npm run build-only
      - run: npm run test:performance
      - run: npm run test:visual-review
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-visual-review
          path: research/search-reports/browser-visual-review
